<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income - Aakash Finance</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>💰 Income</h1>
<p>Add your income easily</p>

<div class="card">

<h2>➕ Add Income</h2>

<label>Income Category</label>

<select id="source">

<option value="">Select Category</option>

<option>💼 Salary</option>

<option>👨‍🏫 Teaching</option>

<option>🎁 Bonus</option>

<option>📚 Copy Checking</option>

<option>💻 Freelancing</option>

<option>💰 Business</option>

<option>🪙 Investment</option>

<option>🎯 Other</option>

</select>

<br><br>

<label>Amount (₹)</label>

<input
id="amount"
type="number"
placeholder="Enter Amount">

<label>Date</label>
  <label>Note</label>

<input
id="incomeNote"
type="text"
placeholder="Example: July Salary">

<input
id="incomeDate"
type="date">

<button onclick="saveIncome()">
💾 Save Income
</button>

</div>

<div class="big-card">

<h2>Total Income</h2>

<h1>
₹<span id="totalIncome">0</span>
</h1>

</div>

<div class="card">

<h2>🔍 Search Income</h2>

<input
type="text"
id="searchIncome"
placeholder="Search..."
onkeyup="searchIncome()">

</div>

<div class="card">

<h2>📜 Income History</h2>

<ul id="incomeList"></ul>

</div>

<div class="action-card"
onclick="history.back()">

⬅ Back Dashboard

</div>

<script src="script.js"></script>

</body>
</html>
