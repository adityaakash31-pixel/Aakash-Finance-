<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense - Aakash Finance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💸 Expense</h1>

<h2>Add Expense</h2>

<label>Expense Name</label><br>
<input id="expenseName" type="text" placeholder="Food / Rent / Travel"><br><br>

<label>Amount (₹)</label><br>
  <label>Date</label><br>
<input id="expenseDate" type="date"><br><br>
<input id="expenseAmount" type="number" placeholder="Enter Amount"><br><br>

<button onclick="saveExpense()">💾 Save Expense</button>

<h2>Total Expense: ₹<span id="totalExpense">0</span></h2>

<h3>Expense History</h3>
<ul id="expenseList"></ul>

<br><br>

<button onclick="history.back()">⬅ Back to Dashboard</button>

<script src="script.js"></script>

</body>
</html>
